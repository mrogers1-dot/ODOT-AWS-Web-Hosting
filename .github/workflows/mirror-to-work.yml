name: Mirror to Work GitHub (mrogers1-dot)

on:
  push:
    branches: [ '**' ]
  create:
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove .github folder (prevents workflow errors on work repo)
        run: |
          rm -rf .github

          # Only commit if something actually changed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(mirror): remove .github folder for work repo" --allow-empty || true

      - name: Push mirror to work repo
        run: |
          git push --all "https://x-access-token:${{ secrets.DESTINATION_REPO_TOKEN }}@github.com/mrogers1-dot/ODOT-AWS-Web-Hosting.git" --force
          git push --tags "https://x-access-token:${{ secrets.DESTINATION_REPO_TOKEN }}@github.com/mrogers1-dot/ODOT-AWS-Web-Hosting.git" --force
