name: Mirror to Work GitHub (mrogers1-dot)

on:
  push:
    branches: [ '**' ]
  create:
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # ← THIS STOPS THE BOT TOKEN

      - name: Mirror to work account
        run: |
          git push --mirror "https://x-access-token:${{ secrets.DESTINATION_REPO_TOKEN }}@github.com/mrogers1-dot/ODOT-AWS-Web-Hosting.git"
