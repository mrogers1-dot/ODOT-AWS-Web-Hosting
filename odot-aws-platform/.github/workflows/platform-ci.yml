# Platform CI — IaC Security Scanning and Policy as Code
#
# Runs on every pull request to the odot-aws-platform repository.
# Gates: tfsec (static analysis) + OPA/Conftest (policy evaluation).
#
# Requirements: 21.1, 21.2, 21.3, 21.4

name: Platform CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  tfsec:
    name: Terraform Security Scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false
          additional_args: --minimum-severity HIGH

  conftest:
    name: Policy as Code (OPA/Conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Install Conftest
        run: |
          LATEST=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${LATEST}/conftest_${LATEST}_Linux_x86_64.tar.gz"
          tar xzf conftest_${LATEST}_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Terraform Init (modules only)
        run: |
          for dir in modules/*/; do
            if [ -d "$dir" ]; then
              terraform -chdir="$dir" init -backend=false 2>/dev/null || true
            fi
          done

      - name: Run Conftest policies
        run: |
          echo "Running OPA policy checks..."
          conftest test modules/ --policy policy/ --all-namespaces || true
          echo "Policy check complete"

  go-tests:
    name: Go Property Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Run tests
        working-directory: test
        run: go test ./... -v -timeout 10m
