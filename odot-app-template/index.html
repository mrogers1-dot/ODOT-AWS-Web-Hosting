<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Real-time Ohio traffic conditions, incidents, construction zones, and weather data from ODOT" />
    <title>Ohio Traffic Dashboard | ODOT</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Initial loading state before React hydrates */
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1B2A4A 0%, #0F1B33 100%);
      }
      #root:empty::after {
        content: 'Loading Ohio Traffic Dashboard...';
        color: rgba(255,255,255,0.6);
        font-size: 14px;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
